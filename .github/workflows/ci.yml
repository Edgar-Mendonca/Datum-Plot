name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python engine (numpy, scipy, matplotlib)
        run: python -m pip install -r py/requirements.txt
      - run: python -m unittest discover -s py/tests -v
      - run: npm ci
      - run: npm run check:ui
      - run: npm run build:ui
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Engine smoke test (every template through the real Python worker)
        run: |
          cargo run -q -p datum-core --example dump all > all.json
          python py/tests/smoke.py all.json
      - name: UI tests (Playwright)
        run: |
          npm i -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          cargo run -q -p datum-core --example dump > tests_ui/fixture.json
          NODE_PATH=$(npm root -g) PYTHON=python node tests_ui/run.cjs

  # The engine and the Python engine on the systems people run it on (the shell is checked above and built on Windows by the release).
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p datum-core --release
      # 0.3.18: embedded graphs (OLE) are Windows code: lint and test them where they run.
      - if: runner.os == 'Windows'
        run: cargo clippy -p datum-ole --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo test -p datum-ole
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r py/requirements.txt
      - run: python -m unittest discover -s py/tests

  # 0.3.20: the built app started by Windows for a document, as a double-click in a document does.
  embedded:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:ui
      - run: cargo build -p datum-plot
      - run: cargo test -p datum-ole -- --ignored --nocapture
        env:
          DATUM_PLOT_EXE: ${{ github.workspace }}\target\debug\datum-plot.exe
      - if: always()
        shell: pwsh
        run: Get-ChildItem -Recurse "$env:APPDATA","$env:LOCALAPPDATA" -Filter embed.log -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName }
      - shell: pwsh
        run: |
          # The document's calls reach the window's thread (the main thread, a single-threaded apartment = 3).
          $l = Get-Content "$env:APPDATA\com.edgarmendonca.datumplot\embed.log"
          if (-not ($l | Select-String 'DoVerb 0 \[thread ThreadId\(1\), apartment 3\]')) { throw "DoVerb did not run on the window's thread" }

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Known vulnerabilities in the window's packages and the bundled Python packages (as cargo deny does for Rust).
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit && pip-audit -r py/requirements.txt

name: Release
# Builds the Windows installers and the Python runtime pack and publishes a GitHub Release that
# the in-app updater picks up: DatumPlot-x.y.z-setup.exe (full, with runtime.zip inside, for first
# installs), DatumPlot-x.y.z-update.exe (app only, a few MB, what Update now downloads) and
# DatumPlot-runtime-N.zip (downloaded by the app only when py/runtime.txt changes). Bump the version in src-tauri/Cargo.toml and
# crates/core/Cargo.toml, add a CHANGELOG.md section, then push a tag (git tag v0.1.0 && git push
# origin v0.1.0) or run this workflow from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - name: Read the app version
        shell: bash
        run: |
          V=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* && "v$V" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $V in src-tauri/Cargo.toml"; exit 1
          fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Python runtime pack (the newest embeddable CPython 3.13 + py/requirements.txt)
        shell: bash
        run: |
          for n in $(seq 25 -1 5); do
            curl -fsSL -o py.zip "https://www.python.org/ftp/python/3.13.$n/python-3.13.$n-embed-amd64.zip" && PYV=3.13.$n && break
          done
          test -n "$PYV" || { echo "No embeddable Python 3.13 found on python.org"; exit 1; }
          echo "Embedded Python $PYV"
          mkdir -p rt && unzip -q py.zip -d rt
          echo "Lib/site-packages" >> rt/python313._pth
          python -m pip install --target rt/Lib/site-packages --only-binary=:all: --no-compile -r py/requirements.txt
          # Leave out what the app never runs: test suites, pip's scripts, sample data.
          find rt/Lib/site-packages -type d \( -name tests -o -name __pycache__ \) -prune -exec rm -rf {} +
          rm -rf rt/Lib/site-packages/bin rt/Lib/site-packages/matplotlib/mpl-data/sample_data
          rt/python.exe -m compileall -q -j 0 rt/Lib/site-packages
          printf '{"cmd":"ping"}\n' | rt/python.exe -X utf8 py/worker.py | tee ping.txt
          grep -q '"matplotlib"' ping.txt
          du -sh rt
          RN=$(tr -d '[:space:]' < py/runtime.txt)
          mkdir -p out
          python -c "import shutil; shutil.make_archive('out/DatumPlot-runtime-$RN', 'zip', 'rt')"
          cp "out/DatumPlot-runtime-$RN.zip" src-tauri/runtime.zip
          ls -la out
      - run: cargo test -p datum-core
      - name: App-only installer (the in-app updater downloads this one)
        shell: bash
        run: |
          npx tauri build --bundles nsis
          cp target/release/bundle/nsis/*-setup.exe "out/DatumPlot-$V-update.exe"
          rm -rf target/release/bundle/nsis
      - name: Full installer (with the Python runtime, for first installs)
        shell: bash
        run: |
          npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json
          cp target/release/bundle/nsis/*-setup.exe "out/DatumPlot-$V-setup.exe"
          cd out && sha256sum DatumPlot-* > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -la
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v v="$V" 'index($0, "## " v " ") == 1 || $0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          cat notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $V"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: Datum Plot ${{ env.V }}
          body_path: notes.md
          make_latest: true
          files: |
            out/DatumPlot-${{ env.V }}-setup.exe
            out/DatumPlot-${{ env.V }}-update.exe
            out/DatumPlot-runtime-*.zip
            out/SHA256SUMS.txt

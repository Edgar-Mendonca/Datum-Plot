# cargo deny check: security advisories, licences and where crates come from (run in CI).
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[advisories]
# Unmaintained crates deep in Tauri's tree are reported, not fatal; real vulnerabilities fail.
unmaintained = "none"

[licenses]
confidence-threshold = 0.9
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0", "BSL-1.0"]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
